name: Detect Secrets

on:
  push:
    branches: [ main, develop, "copilot/**" ]
  pull_request:
    branches: [ main, develop ]

# Set minimal permissions for security
permissions:
  contents: read

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    name: Detect hardcoded secrets
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      
      - name: Install detect-secrets
        run: |
          pip install detect-secrets
      
      - name: Run detect-secrets scan
        run: |
          # Create baseline if it doesn't exist
          if [ ! -f .secrets.baseline ]; then
            echo "Creating initial baseline..."
            detect-secrets scan --baseline .secrets.baseline
          fi
          
          # Scan for new secrets
          echo "Scanning for secrets..."
          detect-secrets scan --baseline .secrets.baseline \
            --exclude-files 'package-lock\.json' \
            --exclude-files 'yarn\.lock' \
            --exclude-files '\.git/' \
            --exclude-files 'node_modules/'
          
          # Audit the baseline
          echo "Auditing secrets..."
          detect-secrets audit .secrets.baseline
      
      - name: Check for high entropy strings
        run: |
          echo "Checking for potential secrets..."
          # Fail if new secrets are detected
          if detect-secrets scan --baseline .secrets.baseline 2>&1 | grep -q "potential secrets"; then
            echo "❌ New secrets detected! Please remove them before committing."
            echo "Run 'detect-secrets scan --baseline .secrets.baseline' locally to see details."
            exit 1
          else
            echo "✅ No new secrets detected."
          fi
      
      - name: Upload baseline
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: secrets-baseline
          path: .secrets.baseline
          retention-days: 30

  security-scan:
    runs-on: ubuntu-latest
    name: Security vulnerability scan
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true
      
      - name: Check for Firebase config issues
        run: |
          echo "Checking for hardcoded Firebase credentials..."
          
          # Check for patterns that might indicate hardcoded secrets
          if grep -r "apiKey.*:.*\"AIza" . --include="*.js" --include="*.html" --include="*.ts" --include="*.jsx" --exclude-dir=node_modules --exclude-dir=.git | grep -v "PLACEHOLDER"; then
            echo "❌ Found potential hardcoded Firebase API keys!"
            echo "Please use environment variables instead."
            exit 1
          fi
          
          echo "✅ No hardcoded Firebase credentials detected."
      
      - name: Verify environment variable usage
        run: |
          echo "Verifying config files use placeholders..."
          
          # List of files that should contain placeholders
          files_to_check=(
            "firebase-config-secure.js"
            "admin/firebase-config-secure.js"
            "acompanhantes/firebase-config-secure.js"
            "acompanhantes/index.html"
          )
          
          for file in "${files_to_check[@]}"; do
            if [ -f "$file" ]; then
              if grep -q "PLACEHOLDER_WILL_BE_REPLACED_BY_BUILD" "$file"; then
                echo "✅ $file uses placeholders"
              else
                echo "⚠️  Warning: $file might not use placeholders correctly"
              fi
            fi
          done
